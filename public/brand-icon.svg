<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256)" fill="none" stroke="#fce7f3" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lotus petals - outer ring -->
    <path d="M0,-40 C20,-160 80,-190 100,-130 C120,-190 180,-160 200,-40" transform="rotate(0)" opacity="0.9"/>
    <path d="M0,-40 C20,-160 80,-190 100,-130 C120,-190 180,-160 200,-40" transform="rotate(72)" opacity="0.9"/>
    <path d="M0,-40 C20,-160 80,-190 100,-130 C120,-190 180,-160 200,-40" transform="rotate(144)" opacity="0.9"/>
    <path d="M0,-40 C20,-160 80,-190 100,-130 C120,-190 180,-160 200,-40" transform="rotate(216)" opacity="0.9"/>
    <path d="M0,-40 C20,-160 80,-190 100,-130 C120,-190 180,-160 200,-40" transform="rotate(288)" opacity="0.9"/>
    <!-- Inner petals -->
    <path d="M0,-30 C15,-110 55,-135 65,-90 C75,-135 115,-110 130,-30" transform="rotate(36)" stroke="#fdf2f8" opacity="0.8"/>
    <path d="M0,-30 C15,-110 55,-135 65,-90 C75,-135 115,-110 130,-30" transform="rotate(108)" stroke="#fdf2f8" opacity="0.8"/>
    <path d="M0,-30 C15,-110 55,-135 65,-90 C75,-135 115,-110 130,-30" transform="rotate(180)" stroke="#fdf2f8" opacity="0.8"/>
    <path d="M0,-30 C15,-110 55,-135 65,-90 C75,-135 115,-110 130,-30" transform="rotate(252)" stroke="#fdf2f8" opacity="0.8"/>
    <path d="M0,-30 C15,-110 55,-135 65,-90 C75,-135 115,-110 130,-30" transform="rotate(324)" stroke="#fdf2f8" opacity="0.8"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="12" fill="#fbcfe8" stroke="none"/>
  </g>
</svg>
